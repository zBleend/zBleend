      <path d="M-6 4 A8 8 0 0 1 4 -4" fill="none" stroke="#22361f" stroke-width="1"/>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">Spring</text>
    </g>
