      <path d="M0 2 L8 18 L6 18 L3 9 L0 16 L-3 9 L-6 18 L-8 18 Z" fill="none" stroke="#22361f" stroke-width="1.3"/>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">Vue</text>
