      <text x="0" y="13" class="font-mono" font-size="7" font-weight="400" fill="#22361f">&#60;/&#62;</text>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">VSCode</text>
    </g>
