<svg width="1000" height="130" viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — HTML, CSS, JS, React, Astro, Vue, Java, Spring, Python, GitHub, Kotlin, VSCode, Android Studio, IntelliJ, AWS, Ableton, Bash">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .paper { fill: #eef2e2; }
    .ink { fill: #22361f; }
    .ink-lab { fill: #517242; }
    .tile { fill: #f8faf1; stroke: #c9d5b0; }
    .glyph-stroke { fill: none; stroke: #22361f; }
  </style>

  <rect width="1000" height="130" class="paper"/>

  <!-- Fila 1 -->
  <g font-size="17" font-weight="700" class="font-sans ink" text-anchor="middle">
    <!-- HTML -->
    <g transform="translate(59,8)">
      <rect x="-45" y="0" width="90" height="52" rx="2" class="tile"/>
      <text x="0" y="17" font-size="17">&#60;&#62;</text>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">HTML</text>
    </g>
    <!-- CSS -->
    <g transform="translate(171,8)">
      <rect x="-45" y="0" width="90" height="52" rx="2" class="tile"/>
      <text x="0" y="17" font-size="17">{ }</text>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">CSS</text>
    </g>
    <!-- JS -->
    <g transform="translate(283,8)">
      <rect x="-45" y="0" width="90" height="52" rx="2" class="tile"/>
      <text x="0" y="18" font-size="15">JS</text>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">JavaScript</text>
    </g>
