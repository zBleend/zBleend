      <circle cx="0" cy="6.5" r="3.2" class="glyph-stroke" stroke-width="1"/>
      <path d="M-7 16 Q0 21 7 16" class="glyph-stroke" stroke-width="1" opacity="0.8"/>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">GitHub</text>
