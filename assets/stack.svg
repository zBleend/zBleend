      <ellipse cx="0" cy="9" rx="8" ry="3" class="glyph-stroke" stroke-width="1" opacity="0.75"/>
      <ellipse cx="0" cy="9" rx="8" ry="3" class="glyph-stroke" stroke-width="1" opacity="0.75" transform="rotate(60)"/>
      <ellipse cx="0" cy="9" rx="8" ry="3" class="glyph-stroke" stroke-width="1" opacity="0.75" transform="rotate(120)"/>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">React</text>
