      <rect x="-45" y="0" width="90" height="52" rx="2" class="tile"/>
      <text x="0" y="18" class="font-mono" font-size="12" font-weight="400" fill="#22361f">$_</text>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">Bash</text>
