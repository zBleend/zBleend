    <g transform="translate(563,66)">
      <rect x="-45" y="0" width="90" height="52" rx="2" class="tile"/>
      <text x="0" y="18" font-size="13">IJ</text>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">IntelliJ</text>
    </g>
    <!-- AWS -->
    <g transform="translate(686,66)">
      <rect x="-45" y="0" width="90" height="52" rx="2" class="tile"/>
      <path d="M-7 10 Q-4 6 0 6 Q4 6 7 10" class="glyph-stroke" stroke-width="1.3"/>
      <path d="M-5 15 Q0 12 5 15" class="glyph-stroke" stroke-width="1" opacity="0.6"/>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">AWS</text>
