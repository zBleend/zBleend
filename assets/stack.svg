      <path d="M-8 2 L-8 12 L8 12 L8 2" fill="none" stroke="#22361f" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8 5 L11 5 L11 10 L8 10" fill="none" stroke="#22361f" stroke-width="1.3"/>
      <path d="M-2 -2 L-1 -4 M2 -3 L3 -5 M6 -2 L7 -4" stroke="#22361f" stroke-width="1" opacity="0.5"/>
      <text x="0" y="44" class="font-mono ink-lab" font-size="10" font-weight="400">Java</text>
    </g>
