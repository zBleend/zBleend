<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cristóbal - Code, Fullstack Developer and Music">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Borde sutil -->
  <rect x="30" y="20" width="1140" height="240" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Decoración japonesa superior izquierda -->
  <text x="80" y="80" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="72" fill="#1a1a1a" opacity="0.3">力</text>

  <!-- Decoración japonesa superior derecha -->
  <text x="1070" y="80" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="72" fill="#1a1a1a" opacity="0.3">美</text>

  <!-- Katana vertical izquierda -->
  <text x="100" y="100" font-family="'Noto Sans JP', sans-serif" font-size="24" fill="#222222" opacity="0.4">刀</text>

  <!-- Katana vertical derecha -->
  <text x="1080" y="100" font-family="'Noto Sans JP', sans-serif" font-size="24" fill="#222222" opacity="0.4">刀</text>

  <!-- Línea decorativa superior -->
  <line x1="200" y1="85" x2="1000" y2="85" stroke="#c9a87c" stroke-width="0.5" opacity="0.2"/>

  <!-- Nombre principal -->
  <text x="600" y="145" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="#e8d5b7">Cristóbal</text>

  <!-- Línea decorativa media -->
  <line x1="350" y1="165" x2="850" y2="165" stroke="#c9a87c" stroke-width="1" opacity="0.3"/>

  <!-- Subtítulo -->
  <text x="600" y="195" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" fill="#555555" letter-spacing="6">CODE · FULLSTACK DEVELOPER · MUSIC</text>

  <!-- Decoración japonesa inferior -->
  <text x="600" y="240" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="14" fill="#333333" letter-spacing="12">力 · 美 · 刀</text>

  <!-- Línea decorativa inferior -->
  <line x1="200" y1="255" x2="1000" y2="255" stroke="#c9a87c" stroke-width="0.5" opacity="0.2"/>
</svg>