<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sobre mí">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8d5b7"/>
      <stop offset="100%" stop-color="#c9a87c"/>
    </linearGradient>
  </defs>

  <!-- Fondo minimalista -->
  <rect width="900" height="480" fill="url(#bg)"/>

  <!-- Borde sutil -->
  <rect x="40" y="30" width="820" height="420" rx="4" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Decoración japonesa superior derecha -->
  <text x="820" y="70" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="48" fill="#1a1a1a" opacity="0.6">力</text>

  <!-- Terminal estilo minimalista -->
  <g transform="translate(60, 60)">
    <!-- Barra de título -->
    <rect width="780" height="32" fill="#1a1a1a"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="40" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="16" r="5" fill="#27c93f"/>
    <text x="390" y="20" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#555555">cristobal@zbleend:~</text>

    <!-- Contenido terminal -->
    <text x="20" y="70" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#e8d5b7">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
      <tspan fill="#c9a87c">$</tspan>
      <tspan fill="#888888"> whoami</tspan>
    </text>

    <text x="20" y="100" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#e8d5b7">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
      <tspan fill="#555555">→</tspan>
      <tspan fill="#c9a87c">[ESTUDIANTE]</tspan>
      <tspan fill="#888888"> Analista Programador · Duoc UC</tspan>
    </text>

    <text x="20" y="130" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#e8d5b7">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/>
      <tspan fill="#555555">→</tspan>
      <tspan fill="#c9a87c">[PRODUCTOR]</tspan>
      <tspan fill="#888888"> Musical · IP ARCOS</tspan>
    </text>

    <text x="20" y="170" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#888888">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.8s" fill="freeze"/>
      El código, como la música, necesita
    </text>

    <text x="20" y="200" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#888888">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze"/>
      estructura y creatividad.
    </text>

    <text x="20" y="240" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#888888">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.2s" fill="freeze"/>
      Transformando experiencia en gestión
    </text>

    <text x="20" y="270" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#888888">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.8s" fill="freeze"/>
      operativa hacia desarrollo de software.
    </text>

    <text x="20" y="310" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#e8d5b7">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="5.6s" fill="freeze"/>
      <tspan fill="#555555">→</tspan>
      <tspan fill="#c9a87c">[ENFOQUE]</tspan>
      <tspan fill="#888888"> frontend, backend, bd, código limpio</tspan>
    </text>

    <text x="20" y="350" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" opacity="0" fill="#e8d5b7">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="6.4s" fill="freeze"/>
      <tspan fill="#555555">→</tspan>
      <tspan fill="#c9a87c">[CONTACTO]</tspan>
      <tspan fill="#c9a87c"> juancrichile@gmail.com</tspan>
    </text>

    <!-- Cursor parpadeante -->
    <rect x="20" y="370" width="8" height="18" rx="1" fill="#c9a87c" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.45;0.55;0.95;1" dur="1s" begin="7.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Decoración japonesa inferior izquierda -->
  <text x="80" y="440" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="32" fill="#1a1a1a" opacity="0.4">美</text>
</svg>