<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cristóbal — Analista Programador y Productor Musical">
  <style>
    .font-display { font-family: "Yu Mincho", "Hiragino Mincho ProN", "Yu Gothic", serif; }
    .font-mono { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .paper { fill: #070907; }
    .ink { fill: #d3d2bc; }
    .ink-dim { fill: #9aa888; }
    .ink-muted { fill: #6c7a5d; }
    .ink-faint { fill: #46503f; }
    .line { stroke: #1d241c; }
    .leaf { fill: #7fae5f; }
    .mark { fill: #0e150d; }
  </style>

  <!-- Papel -->
  <rect width="1000" height="340" class="paper"/>

  <!-- Watermark 力 -->
  <text x="1015" y="305" text-anchor="end" class="font-display mark" font-size="300" font-weight="600">力</text>

  <!-- Watermark 美 -->
  <text x="908" y="332" text-anchor="end" class="font-display" font-size="48" fill="#0f160e">美</text>

  <!-- Katana: filo -->
  <line x1="52" y1="62" x2="52" y2="286" stroke="#7fae5f" stroke-width="1" opacity="0.45"/>
  <circle cx="52" cy="58" r="2" fill="#7fae5f" opacity="0.6"/>
  <line x1="46" y1="288" x2="58" y2="288" stroke="#1d241c" stroke-width="1.5"/>

  <!-- Nombre -->
  <text x="84" y="160" class="font-display ink" font-size="64" font-weight="600" letter-spacing="1">Cristóbal</text>

  <!-- Subtítulo -->
  <text x="86" y="198" class="font-mono ink-dim" font-size="18">Analista Programador · Productor Musical</text>

  <!-- Hairline -->
  <line x1="84" y1="216" x2="924" y2="216" class="line" stroke-width="1"/>

  <!-- Cita -->
  <text x="86" y="252" class="font-mono ink-muted" font-size="16">El código, como la música: estructura y creatividad.</text>

  <!-- Colofón -->
  <text x="86" y="323" class="font-mono ink-faint" font-size="11" letter-spacing="1">PAPER #070907 · ONE RAMP · FOUR TIERS · MIN 4.6:1 · RADIUS 2 · NO SHADOW</text>

  <!-- Trío footer -->
  <text x="914" y="323" text-anchor="end" class="font-display ink-muted" font-size="15" letter-spacing="4">力 · 美 · 刀</text>

  <!-- Terminal -->
  <g transform="translate(640,64)">
    <rect width="300" height="240" rx="2" fill="none" stroke="#1d241c" stroke-width="1"/>
    <circle cx="12" cy="14" r="2.5" fill="#46503f"/>
    <circle cx="21" cy="14" r="2.5" fill="#46503f"/>
    <circle cx="30" cy="14" r="2.5" fill="#46503f"/>
    <text x="150" y="19" text-anchor="middle" class="font-mono ink-muted" font-size="13">zbleend@cristobal:~</text>

    <text x="16" y="58" class="font-mono" font-size="16">
      <tspan fill="#7fae5f">$</tspan>
      <tspan fill="#9aa888"> whoami</tspan>
    </text>
    <text x="16" y="86" class="font-mono ink-dim" font-size="16">Analista Programador · Duoc UC</text>

    <text x="16" y="118" class="font-mono" font-size="16">
      <tspan fill="#7fae5f">$</tspan>
      <tspan fill="#9aa888"> produce</tspan>
    </text>
    <text x="16" y="146" class="font-mono ink-dim" font-size="16">Productor Musical · IP ARCOS</text>

    <text x="16" y="178" class="font-mono" font-size="16">
      <tspan fill="#7fae5f">$</tspan>
      <tspan fill="#9aa888"> email</tspan>
    </text>
    <text x="16" y="206" class="font-mono ink-dim" font-size="16">juancrichile@gmail.com</text>

    <rect x="250" y="208" width="7" height="16" fill="#7fae5f"/>
  </g>
</svg>