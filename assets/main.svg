  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .fill-bone { fill: #e8d5b7; }
    .fill-gold { fill: #c9a87c; }
    .fill-gray { fill: #555555; }
    .fill-gray-light { fill: #888888; }
    .fill-gray-dark { fill: #333333; }
    .fill-border { fill: #1a1a1a; }
    .stroke-gold { stroke: #c9a87c; }
    .stroke-border { stroke: #1a1a1a; }
    .stroke-border-light { stroke: #222222; }

    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: #0a0a0a; }
    }
    @media (prefers-color-scheme: light) {
      .bg-rect { fill: #f5f0eb; }
      .fill-bone { fill: #2a1f14; }
      .fill-gold { fill: #a07840; }
      .fill-gray { fill: #666666; }
      .fill-gray-light { fill: #999999; }
      .fill-gray-dark { fill: #555555; }
      .fill-border { fill: #e0dcd7; }
      .stroke-border { stroke: #e0dcd7; }
      .stroke-border-light { stroke: #ccc8c3; }
    }
  </style>

