    <text x="50" y="60" xml:space="preserve">
      <tspan x="50" dy="0">       /\_</tspan>
      <tspan x="50" dy="1.2em">      / / \</tspan>
      <tspan x="50" dy="1.2em">     / /   \</tspan>
      <tspan x="50" dy="1.2em">    / /     \</tspan>
      <tspan x="50" dy="1.2em">   / /       \_             __________________________________________</tspan>
      <tspan x="50" dy="1.2em">  / /          \_          / ________________________________________ /</tspan>
      <tspan x="50" dy="1.2em"> / /             \________/ /</tspan>
      <tspan x="50" dy="1.2em">( * )_____________|_________|</tspan>
      <tspan x="50" dy="1.2em"> \_\               / /</tspan>
      <tspan x="50" dy="1.2em">  \_\             /_/</tspan>
      <tspan x="50" dy="1.2em">   \_\</tspan>
      <tspan x="50" dy="1.2em">    \_\</tspan>
      <tspan x="50" dy="1.2em">     \_\</tspan>
      <tspan x="50" dy="1.2em">      \_\</tspan>
      <tspan x="50" dy="1.2em">       \_)</tspan>
    </text>
  </g>

